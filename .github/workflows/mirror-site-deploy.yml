name: Mirror site code to Al-Falah-Website

# Keeps arjalloh79-coder/Al-Falah-Website's main branch in sync with
# backend/live-site-extension/ in this repo, automatically, so the live
# server always has a clean, root-level checkout target to `git pull` from.
#
# Al-Falah-Website's main branch is entirely generated by this workflow.
# Never hand-edit or commit to it directly -- changes go there only
# through backend/live-site-extension/ here.

on:
  push:
    branches: [main]
    paths:
      - 'backend/live-site-extension/**'
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split backend/live-site-extension into its own branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=backend/live-site-extension -b site-deploy

      - name: Push to Al-Falah-Website
        env:
          TOKEN: ${{ secrets.SITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::SITE_DEPLOY_TOKEN secret is not set. Add a Personal Access Token with 'repo' scope as a repository secret named SITE_DEPLOY_TOKEN (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          git push --force "https://${TOKEN}@github.com/arjalloh79-coder/Al-Falah-Website.git" site-deploy:main
